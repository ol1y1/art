name = "ol1y-art-api"
main = "index.js"
compatibility_date = "2024-01-01"

# Environment variables — set the SECRET values in the Cloudflare dashboard
# under Workers > ol1y-art-api > Settings > Variables
# Never put real keys in this file — it lives in your public GitHub repo.

[vars]
ALLOWED_ORIGIN = "https://ol1y.art"

# Secrets to add via dashboard (or wrangler secret put):
#   ALCHEMY_KEY
#   HELIUS_KEY
#   ORDISCAN_KEY
